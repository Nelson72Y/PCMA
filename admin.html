<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員入口 | TECHFIX 後台</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container {
            padding: 100px 10%;
        }

        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            transition: var(--transition-smooth);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 3rem;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 153, 0.1);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .status-pending {
            color: #ffcc00;
            border: 1px solid #ffcc00;
        }

        .status-fixing {
            color: #0099ff;
            border: 1px solid #0099ff;
        }

        .status-done {
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .cost-input {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 5px;
            border-radius: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 255, 153, 0.3);
        }

        @media (max-width: 992px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="theme-dark">
    <div id="login-overlay">
        <div class="login-box">
            <div class="logo" style="margin-bottom: 2rem; justify-content: center;">
                <i data-lucide="cpu"></i> TECH<span>FIX</span> ADMIN
            </div>
            <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">管理員登入</h2>
            <form id="login-form" style="display: grid; gap: 1.2rem;">
                <div class="form-group" style="text-align: left;">
                    <label
                        style="font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Email</label>
                    <input type="email" id="login-email" required placeholder="admin@example.com"
                        style="width: 100%; background: var(--surface-color); border: 1px solid var(--surface-border); padding: 0.8rem; color: var(--text-primary); border-radius: 4px; margin-top: 5px;">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label
                        style="font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase;">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        style="width: 100%; background: var(--surface-color); border: 1px solid var(--surface-border); padding: 0.8rem; color: var(--text-primary); border-radius: 4px; margin-top: 5px;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem;">驗證進入</button>
            </form>
            <p id="login-error" style="color: #ff4444; font-size: 0.85rem; margin-top: 1rem; display: none;">登入失敗，請檢查帳密。
            </p>
            <a href="index.html"
                style="display: block; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; text-decoration: none;">←
                返回首頁</a>
        </div>
    </div>

    <div id="admin-content" style="display: none;">
        <nav>
            <div class="logo"><i data-lucide="cpu"></i> TECH<span>FIX</span> ADMIN</div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="dark" title="Dark Mode">
                        <i data-lucide="moon"></i>
                    </button>
                    <button class="theme-btn" data-theme="light" title="Light Mode">
                        <i data-lucide="sun"></i>
                    </button>
                </div>
                <a href="index.html"
                    style="text-decoration: none; color: var(--text-secondary); align-self: center; font-size: 0.9rem;">返回首頁</a>
                <button id="logout-btn" class="btn-primary"
                    style="padding: 6px 15px; font-size: 0.8rem; border-color: #ff4444; color: #ff4444;">登出</button>
            </div>
        </nav>

        <div class="admin-container">
            <h1 style="margin-bottom: 2.5rem;">維修儀表板</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <span style="font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 0.1em;">待修件數</span>
                    <span class="stat-value" id="stat-pending-total">0</span>
                </div>
                <div class="stat-card">
                    <span style="font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 0.1em;">總營收金額</span>
                    <span class="stat-value" id="stat-total-revenue">NT$ 0</span>
                </div>
                <div class="stat-card">
                    <span style="font-size: 0.8rem; color: var(--text-secondary); letter-spacing: 0.1em;">本月已完工</span>
                    <span class="stat-value" id="stat-month-done">0</span>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.5rem;">工單管理列表</h2>
                <div style="position: relative; width: 300px;">
                    <input type="text" id="order-search" class="cost-input"
                        style="width: 100%; padding: 10px 10px 10px 35px;" placeholder="搜尋姓名或電話...">
                    <i data-lucide="search"
                        style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div
                style="background: rgba(255,255,255,0.02); border: 1px solid var(--surface-border); border-radius: 12px; overflow: hidden; backdrop-filter: blur(10px);">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr
                            style="background: rgba(255,255,255,0.05); color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase;">
                            <th style="padding: 1rem 1.5rem;">客戶資訊</th>
                            <th style="padding: 1rem 1.5rem;">故障描述</th>
                            <th style="padding: 1rem 1.5rem;">預算/狀態</th>
                            <th style="padding: 1rem 1.5rem; text-align: right;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list">
                        <tr>
                            <td colspan="4" style="padding: 3rem; text-align: center;">載入中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Status Change Modal -->
    <div id="status-modal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2>更新工單狀態</h2>
                <i data-lucide="x" id="close-modal-btn" style="cursor: pointer;"></i>
            </div>
            <div style="display: grid; gap: 1rem;">
                <button class="btn-primary status-btn" data-status="待處理">待處理</button>
                <button class="btn-primary status-btn" data-status="維修中"
                    style="border-color: #0099ff; color: #0099ff;">維修中</button>
                <button class="btn-primary status-btn" data-status="已完工"
                    style="border-color: var(--accent-color); color: var(--accent-color);">已完工</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script>
        lucide.createIcons();
        let allOrders = [];
        let activeOrderId = null;

        // AUTH CHECK
        const checkUser = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showAdmin();
            } else {
                showLogin();
            }
        };

        const showAdmin = () => {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            fetchOrders();
        };

        const showLogin = () => {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('admin-content').style.display = 'none';
        };

        // LOGIN ACTION
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.style.display = 'block';
                errorEl.innerText = '登入失敗：' + error.message;
            } else {
                errorEl.style.display = 'none';
                showAdmin();
            }
        };

        // LOGOUT ACTION
        document.getElementById('logout-btn').onclick = async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        };

        async function fetchOrders() {
            const { data, error } = await supabaseClient
                .from('repair_orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (data) {
                allOrders = data;
                updateDashboardStats(allOrders);
                renderOrders(allOrders);
            }
        }

        function renderOrders(orders) {
            const list = document.getElementById('orders-list');
            if (orders.length === 0) {
                list.innerHTML = '<tr><td colspan="4" style="padding: 3rem; text-align: center; color: var(--text-secondary);">尚未找到相關工單</td></tr>';
                return;
            }
            list.innerHTML = orders.map(order => `
                <tr style="border-bottom: 1px solid var(--surface-border);">
                    <td style="padding: 1.2rem 1.5rem;">
                        <div style="font-weight: 600;">${order.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${order.phone}</div>
                    </td>
                    <td style="padding: 1.2rem 1.5rem; font-size: 0.85rem; color: var(--text-secondary); max-width: 300px;">
                        ${order.issue_description || '無描述'}
                    </td>
                    <td style="padding: 1.2rem 1.5rem;">
                        <input type="number" class="cost-input" value="${order.price}" style="width: 70px; margin-bottom: 5px;" onblur="updateField('${order.id}', 'price', this.value)">
                        <br><span class="status-badge status-${getStatusClass(order.status)}">${order.status}</span>
                    </td>
                    <td style="padding: 1.2rem 1.5rem; text-align: right;">
                        <button class="btn-primary" onclick="openStatusModal('${order.id}')" style="font-size: 0.7rem; padding: 4px 8px;">狀態</button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function getStatusClass(s) {
            return s === '待處理' ? 'pending' : (s === '維修中' ? 'fixing' : 'done');
        }

        async function updateField(id, field, val) {
            const { error } = await supabaseClient.from('repair_orders').update({ [field]: val }).eq('id', id);
            if (!error) fetchOrders();
        }

        const statusModal = document.getElementById('status-modal');
        function openStatusModal(id) { activeOrderId = id; statusModal.classList.add('active'); }
        document.getElementById('close-modal-btn').onclick = () => statusModal.classList.remove('active');
        document.querySelectorAll('.status-btn').forEach(b => {
            b.onclick = async () => {
                if (activeOrderId) {
                    await updateField(activeOrderId, 'status', b.dataset.status);
                    statusModal.classList.remove('active');
                }
            };
        });

        // Search
        document.getElementById('order-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderOrders(allOrders.filter(o => o.name.toLowerCase().includes(t) || o.phone.includes(t)));
        };

        function updateDashboardStats(data) {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            // 1. 待修件數 (所有狀態為待處理的)
            const pendingCount = data.filter(o => o.status === '待處理').length;

            // 2. 總營收金額 (所有工單的 price 總和)
            const totalRevenue = data.reduce((sum, o) => sum + (Number(o.price) || 0), 0);

            // 3. 本月已完工 (本月且狀態為已完工)
            const monthCompleted = data.filter(o => {
                const orderDate = new Date(o.created_at);
                return o.status === '已完工' &&
                    orderDate.getMonth() === currentMonth &&
                    orderDate.getFullYear() === currentYear;
            }).length;

            // 更新 UI
            document.getElementById('stat-pending-total').innerText = pendingCount;
            document.getElementById('stat-total-revenue').innerText = `NT$ ${totalRevenue.toLocaleString()}`;
            document.getElementById('stat-month-done').innerText = monthCompleted;
        }

        checkUser();
    </script>
</body>

</html>
